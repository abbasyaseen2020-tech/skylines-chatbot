<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول — متابعة التاسكات</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    body {
      background: linear-gradient(135deg, #0d1b2a 0%, #1e3a5f 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .login-card {
      background: #fff; border-radius: 20px; padding: 2.5rem;
      width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }
    .login-card .logo { font-size: 2.5rem; }
    .login-card h4 { color: #0d1b2a; font-weight: 700; }
    .login-card .subtitle { color: #666; font-size: .9rem; }
    .form-control { border-radius: 10px; padding: .75rem 1rem; }
    .btn-login {
      background: linear-gradient(135deg, #1e88e5, #0d47a1);
      border: none; border-radius: 10px; padding: .8rem; font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="login-card text-center">
    <div class="logo mb-2">🏢</div>
    <h4>Sky Lines</h4>
    <p class="subtitle mb-4">نظام متابعة تاسكات التيم</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} text-start">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post" class="text-start">
      <div class="mb-3">
        <label class="form-label fw-semibold">اسم المستخدم</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control" placeholder="username"
                 autocomplete="username" required>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">كلمة السر</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control" placeholder="••••••"
                 autocomplete="current-password" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-login w-100 text-white">
        <i class="bi bi-box-arrow-in-right me-1"></i> دخول
      </button>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
